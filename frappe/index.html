<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POP TYPE! - Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">POP TYPE!</h1>
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="en">🇬🇧</button>
                <button class="lang-btn" data-lang="fr">🇫🇷</button>
            </div>
        </header>

        <div class="game-area" id="gameArea">
            <div class="start-screen" id="startScreen">
                <h2 class="subtitle">Type the words as they appear!</h2>
                <button class="start-btn" id="startBtn">START!</button>
            </div>

            <div class="play-screen hidden" id="playScreen">
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
                <div class="stats">
                    <span class="stat">Time: <span id="timeLeft">60</span>s</span>
                    <span class="stat">Words: <span id="wordsTyped">0</span></span>
                    <span class="stat">WPM: <span id="wpm">0</span></span>
                </div>
                
                <div class="word-display" id="wordDisplay"></div>
                
                <div class="input-area">
                    <input type="text" id="wordInput" class="word-input" autocomplete="off" autofocus>
                </div>
            </div>

            <div class="result-screen hidden" id="resultScreen">
                <h2 class="result-title">GAME OVER!</h2>
                <div class="final-stats">
                    <div class="final-wpm" id="finalWPM">0</div>
                    <div class="wpm-label">Words Per Minute</div>
                    <div class="final-words">You typed <span id="finalWords">0</span> words!</div>
                </div>
                <button class="restart-btn" id="restartBtn">PLAY AGAIN!</button>
            </div>
        </div>

        <div class="floating-words" id="floatingWords"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
