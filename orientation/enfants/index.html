        let currentQuestion = 0;
        let answers = [];
        let shuffledQuestions = [];
        let savedResults = '';

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startQuiz() {
            shuffledQuestions = shuffleArray(questions);
            currentQuestion = 0;
            answers = [];
            document.querySelector('.welcome-screen').classList.remove('active');
            document.querySelector('.quiz-screen').classList.add('active');
            showQuestion();
        }

        function showQuestion() {
            const question = shuffledQuestions[currentQuestion];
            document.getElementById('current').textContent = currentQuestion + 1;
            document.getElementById('question').textContent = question.question;
            
            const answersHtml = question.answers.map((answer, index) => 
                `<div class="answer" onclick="selectAnswer(${index})">${answer.text}</div>`
            ).join('');
            
            document.getElementById('answers').innerHTML = answersHtml;
        }

        function selectAnswer(answerIndex) {
            const answerElements = document.querySelectorAll('.answer');
            
            if (!answers[currentQuestion]) {
                answers[currentQuestion] = [];
            }
            
            const index = answers[currentQuestion].indexOf(answerIndex);
            if (index > -1) {
                answers[currentQuestion].splice(index, 1);
                answerElements[answerIndex].classList.remove('selected');
            } else {
                answers[currentQuestion].push(answerIndex);
                answerElements[answerIndex].classList.add('selected');
            }
        }

        function nextQuestion() {
            if (!answers[currentQuestion] || answers[currentQuestion].length === 0) {
                alert("Choisis au moins une réponse !");
                return;
            }

            currentQuestion++;
            if (currentQuestion < shuffledQuestions.length) {
                showQuestion();
            } else {
                calculateResults();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && document.querySelector('.quiz-screen').classList.contains('active')) {
                nextQuestion();
            }
        });

        function calculateResults() {
            const scores = {};
            
            for (let i = 0; i < shuffledQuestions.length; i++) {
                const question = shuffledQuestions[i];
                const answerIndexes = answers[i];
                const weight = 1 / answerIndexes.length;
                
                answerIndexes.forEach(answerIndex => {
                    const answer = question.answers[answerIndex];
                    for (let career in answer.scores) {
                        scores[career] = (scores[career] || 0) + (answer.scores[career] * weight);
                    }
                });
            }

            const sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topProfiles = sortedScores.slice(0, 3);
            
            showResults(topProfiles, scores);
        }

        function showResults(topProfiles, allScores) {
            document.querySelector('.quiz-screen').classList.remove('active');
            document.querySelector('.result-screen').classList.add('active');

            const total = topProfiles.reduce((sum, [_, score]) => sum + score, 0);
            
            let resultsHtml = '';
            
            topProfiles.forEach(([profileKey, score], index) => {
                const career = careers[profileKey];
                const percentage = Math.round((score / total) * 100);
                
                resultsHtml += `
                    <div class="result-card">
                        <span class="emoji">${career.emoji}</span>
                        <h2>${index === 0 ? '🏆 ' : ''}${career.title}</h2>
                        <p>${career.description}</p>
                        <p style="font-size: 1.5em; margin-top: 15px; font-weight: bold;">${percentage}% compatible !</p>
                    </div>
                    <div class="job-list">
                        <h3>Métiers qui pourraient te plaire :</h3>
                        ${career.jobs.map(job => `<span class="job-item" onclick="showJobDetails(\`${job}\`)">${job}</span>`).join('')}
                    </div>
                `;
            });
            
            document.getElementById('results').innerHTML = resultsHtml;
            savedResults = resultsHtml;
        }

        function showJobDetails(jobName) {
            const job = jobsDatabase[jobName];
            if (!job) {
                alert("Désolé, les informations sur ce métier ne sont pas disponibles !");
                return;
            }

            const jobDetailsHtml = `
                <div class="job-card">
                    <h2>${jobName}</h2>
                    
                    <h3>📖 C'est quoi ce métier ?</h3>
                    <p>${job.description}</p>
                    
                    <h3>✨ Ce que tu feras :</h3>
                    <ul>
                        ${job.missions.map(mission => `<li>${mission}</li>`).join('')}
                    </ul>
                    
                    <h3>📚 Comment devenir ${jobName} ?</h3>
                    <p>${job.formation}</p>
                    
                    <h3>💪 Les qualités qu'il faut avoir :</h3>
                    <ul>
                        ${job.qualites.map(qualite => `<li>${qualite}</li>`).join('')}
                    </ul>
                </div>
            `;

            document.querySelector('.result-screen').classList.remove('active');
            document.querySelector('.job-detail-screen').classList.add('active');
            document.getElementById('job-details').innerHTML = jobDetailsHtml;
        }

            document.querySelector('.job-detail-screen').classList.remove('active');
            document.querySelector('.result-screen').classList.add('active');
